<script>
(async()=>{
 let html;
 try{
  const r=await fetch("old.html?v="+Date.now(),{cache:"no-store"});
  if(!r.ok)throw new Error("x");
  html=await r.text();
 }catch(e){
  document.body.innerHTML='<p style="color:#b42318;font-weight:bold">مش لاقي ملف old.html. لازم تغيّر اسم الملف القديم من index.html إلى old.html على GitHub.</p>';
  return;
 }
 const fails=[];
 const rep=(name,a,b)=>{const n=html.split(a).length-1;if(n!==1){fails.push(name);return}html=html.split(a).join(b)};
 const range=(name,s,e,b)=>{const i=html.indexOf(s);const j=i<0?-1:html.indexOf(e,i);if(j<0){fails.push(name);return}html=html.slice(0,i)+b+html.slice(j+e.length)};

 /* 1) حذف زرار حفظ وتأكيد */
 rep("حذف الزرار",`<button class="p" id="save">حفظ وتأكيد</button>`,``);

 rep("حذف intercept الحفظ",`intercept("save","حفظ الرحلة",()=>{$("save").onclick()},false);`,``);

 /* 2) نوع اوفر داي كول خاص */
 rep("ثوابت كول",`const EXITS=[`,`const COOL="اوفر داي كول خاص",PROG_COOL="رست 85 + بالون";
const EXITS=[`);
 rep("خيار كول",`<option>اوفر داي</option><option>اوفر نايت</option>`,`<option>اوفر داي</option><option>اوفر داي كول خاص</option><option>اوفر نايت</option>`);
 rep("isDef",`.concat(Object.values(lsGet("fts_progs",{}))).some(`,`.concat(Object.values(lsGet("fts_progs",{})),[PROG_COOL]).some(`);
 rep("progFor",`function progFor(d){const o=`,`function progFor(d){if($("ttype").value===COOL)return PROG_COOL;const o=`);
 rep("progSave",`$("progSave").onclick=()=>{const o=`,`$("progSave").onclick=()=>{if($("ttype").value===COOL){$("progmsg").textContent="برنامج كول خاص ثابت ومينفعش يتحفظ كافتراضي";return}const o=`);
 rep("updTrip",`function updTrip(){const t=$("ttype").value==="توصيلة";`,`function forceCool(){
 const c=$("ttype").value===COOL;
 $("gfSel").disabled=c;$("gfOther").disabled=c;
 if(c){$("gfSel").value="الأقصر";$("gfOther").style.display="none";$("gfTo").value="الأقصر";syncDirs();
  document.querySelectorAll("[data-g=e]").forEach((x,k)=>x.checked=(k===EX2["الأقصر"]))}
 applyProg(c);applyTimes()}
function updTrip(){forceCool();const t=$("ttype").value==="توصيلة";`);
 rep("dn",`const dn=(s.ttype==="اوفر داي"||s.ttype==="اوفر نايت");`,`const dn=(s.ttype==="اوفر داي"||s.ttype==="اوفر نايت"||s.ttype===COOL);`);
 rep("bdriver",`if(bus&&s.ttype==="اوفر داي"){`,`if(bus&&(s.ttype==="اوفر داي"||s.ttype===COOL)){`);

 /* 3) تحذير الاتجاه والبرنامج */
 rep("missing",`if(!s.chassis.trim())add("chassis","رقم الشاسيه (للـ GPS)",false);`,`if(!s.chassis.trim())add("chassis","رقم الشاسيه (للـ GPS)",false);
 const pm=progMismatch(s);if(pm)m.push([s.ttype==="توصيلة"?"progExtra":"prog",pm,true,true]);`);
 range("showMiss",`function showMiss(focus){`,`return b.length>0}`,`function showMiss(focus){
 document.querySelectorAll(".bad").forEach(x=>x.classList.remove("bad"));
 const m=missing(state()),b=m.filter(x=>x[2]&&!x[3]),c=m.filter(x=>x[3]),w=m.filter(x=>!x[2]),box=$("miss");
 if(!m.length){box.style.display="none";return false}
 box.className="miss "+(b.length||c.length?"blk":"wrn");box.style.display="";
 box.innerHTML=[b.length?"<b>⚠ ناقص ولازم تكتبه قبل الطباعة:</b> "+b.map(x=>x[1]).join("، "):"",c.length?"<b>⚠ تحذير:</b> "+c.map(x=>x[1]).join("، "):"",w.length?"<b>تنبيه (مش مكتوب):</b> "+w.map(x=>x[1]).join("، "):""].filter(Boolean).join("<br>");
 if(focus){m.forEach(x=>{const e=$(x[0]);if(e)e.classList.add("bad")});
  const t=b[0]||c[0];if(t){const f=$(t[0]);if(f){f.scrollIntoView({block:"center"});f.focus()}}}
 return b.length>0||c.length>0}`);
 rep("intercept",`const m=missing(state()).filter(x=>x[2]);`,`const m=missing(state()).filter(x=>x[2]&&!(id==="reset"&&x[3]));`);
 rep("عنوان التأكيد",`<b>⚠ في بيانات ناقصة</b>`,`<b>⚠ تنبيه قبل ما تكمّل</b>`);
 rep("نص التأكيد",`من غير ما تكملها؟`,`رغم كده؟`);

 /* 4) تنبيه رحلة جديدة بعد الطباعة */
 rep("print1",`if(!w){try{window.print()}catch(e){}return}`,`if(!w){try{window.print()}catch(e){}setTimeout(askNew,300);return}`);
 rep("print2",`w.document.close();setTimeout(()=>{w.focus();w.print()},500)};`,`w.document.close();setTimeout(()=>{w.focus();w.print()},500);setTimeout(askNew,800)};`);

 /* 5) استيراد العربيات: يقبل الشكلين (الموقع الأصلي وموقعك القديم) */
 rep("استيراد العربيات",`arr.forEach(x=>{const g=`,`arr.forEach(x=>{if(x&&x.cnum){x={carName:x.tco,carType:x.ctype,carNumber:x.cnum,carPlate:x.cbelong,chassisNumber:x.chassis,driverName:x.driver,driverPhone:x.dphone,backupDriverName:x.bdriver,backupDriverPhone:x.bphone}}const g=`);

 /* الدوال الجديدة داخل السكريبت الأساسي */
 const extra=`
function nz(x){return String(x||"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي")}
function progMismatch(s){
 const KW={"القاهرة":["الزعفران","هرم","اهرام","خان خليل","مصر القديم","مرسي الحجه","سقاره","القاهر"],"الأقصر":["رست 85","كرنك","حتشبسوت","ممنون","ملوك","ملكات","الاقصر"],"أسوان":["السد العالي","فيله","المسله","فلوكه","اسوان"]};
 const to=(s.gfTo||"").trim(),p=nz(s.progOut);
 if(!KW[to]||!p.trim())return"";
 const bad=Object.keys(KW).find(k=>k!==to&&KW[k].some(w=>p.includes(w)));
 return bad?"الاتجاه "+to+" لكن البرنامج بتاع "+bad:""}
function askNew(){
 let o=document.getElementById("cfov");if(o)o.remove();
 o=document.createElement("div");o.id="cfov";o.className="ov";
 o.innerHTML='<div class="cf" role="dialog" aria-modal="true"><b>⚠ لازم تعمل رحلة جديدة</b><p style="margin:8px 0">الإخطار اتبعت للطباعة واتسجل. قبل ما تكتب رحلة تانية اضغط «رحلة جديدة»، وإلا التعديل هيتحفظ مكان الرحلة اللي لسه طابعها.</p><div class="row"><button class="p" id="nwY">رحلة جديدة دلوقتي</button><button id="nwN">لاحقًا</button></div></div>';
 document.body.appendChild(o);
 $("nwY").onclick=()=>{o.remove();$("reset").onclick();curId=null;check();window.scrollTo(0,0)};
 $("nwN").onclick=()=>o.remove();
 $("nwY").focus()}
`;
 const k=html.lastIndexOf("</scr"+"ipt>");
 if(k<0){fails.push("إضافة الدوال")}else{html=html.slice(0,k)+extra+html.slice(k)}

 if(fails.length){
  const banner='<div style="background:#b42318;color:#fff;padding:8px 12px;font-size:14px">تعديلات مطبقتش: '+fails.join("، ")+'</div>';
  html=html.split("<body>").join("<body>"+banner);
 }
 document.open();document.write(html);document.close();
})();
