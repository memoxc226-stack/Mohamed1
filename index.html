var GPS_SHEET="1UbKNSxmAQGF1UA8rWZR9ekokAPIE_Lnkc_1gfowNzTM",GPS_GID="0",gpsIdx=null;
function gpsAr(x){return String(x==null?"":x).replace(/[٠-٩]/g,function(c){return c.charCodeAt(0)-1632})}
function gpsDig(x){return gpsAr(x).replace(/\\D/g,"")}
function gpsLet(x){return nz(x).replace(/[^ء-ي]/g,"")}
function gpsCh(x){return gpsAr(x).replace(/[^0-9A-Za-z]/g,"").toUpperCase().replace(/^0+/,"")}
function gpsCell(row,i){var c=row.c&&row.c[i];if(!c)return"";var v=c.f!=null?c.f:c.v;return v==null?"":String(v).trim()}
function gpsBuild(r){
 var rows=(r.table&&r.table.rows)||[],ch={},pl={},n=0;
 rows.forEach(function(x,i){
  var o={t:gpsCell(x,0),lt:gpsCell(x,5),num:gpsCell(x,6),ch:gpsCell(x,7),st:gpsCell(x,8),nt:gpsCell(x,9),i:i};
  if(!/\\d/.test(o.t))return;
  var k=gpsCh(o.ch),d=gpsDig(o.num);
  if(!k&&!d)return;
  n++;
  if(k)ch[k]=o;
  if(d)pl[d+"|"+gpsLet(o.lt)]=o});
 return {ch:ch,pl:pl,n:n}}
function gpsFind(c){

 var a=null,b=null,k=gpsCh(c.chassis),d=gpsDig(c.cnum);
 if(k)a=gpsIdx.ch[k]||null;

 if(a&&b)return a.i>b.i?a:b;
 return a||b}
function gpsChip(st,empty){

function gpsLoad(){
